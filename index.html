<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="gold" data-mode="night" data-board="felt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YanivNest · יניב</title>
<meta name="description" content="יניב — משחק הקלפים הישראלי: מול המחשב, שניים בטלפון אחד, ואונליין עם חברים וקול.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="YanivNest · יניב">
<meta property="og:description" content="יניב מול המחשב, בטלפון אחד או אונליין עם חברים — עם לחץ-ודבר והודעות קוליות.">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------------- tokens: app theme (data-theme × data-mode) ---------------- */
:root{
  --bg:#070707; --panel:#121212; --panel2:#1a1a1a; --line:#2c2a24; --ink:#f3efe4; --muted:#a39d8c;
  --acc:#d4a940; --acc2:#f0cd6e; --accInk:#140f02; --ok:#46b46e; --bad:#e0584f;
  --felt1:#1f6b45; --felt2:#0f4029; --feltLine:rgba(255,255,255,.10); --feltInk:#f4f1e6;
  --cardFace:#fdfbf4; --cardEdge:#cfcac0; --red:#c4262e; --blk:#141414;
  --back1:#141414; --back2:#d4a940;
  --r:14px; --disp:'Secular One','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[data-theme="silver"]{--acc:#c9ced6;--acc2:#eef1f5;--accInk:#0d0f12;--line:#2a2d33;--back2:#c9ced6}
[data-theme="emerald"]{--acc:#3fbf7f;--acc2:#7fe0ae;--accInk:#03140b;--line:#1f3329;--back2:#3fbf7f}
[data-theme="ruby"]{--acc:#e0566a;--acc2:#f598a6;--accInk:#1a0408;--line:#3a2328;--back2:#e0566a}
[data-theme="ocean"]{--acc:#4aa8e8;--acc2:#97d0f6;--accInk:#03111c;--line:#1f2d3a;--back2:#4aa8e8}
[data-mode="day"]{--bg:#f4f2ec;--panel:#ffffff;--panel2:#f0ede5;--line:#d9d3c4;--ink:#17150f;--muted:#6b6455;--back1:#2a261c}
[data-mode="day"][data-theme="gold"]{--acc:#a8801c;--acc2:#c99b2c;--accInk:#fff}
[data-mode="day"][data-theme="silver"]{--acc:#5c6573;--acc2:#7d8796;--accInk:#fff}
[data-mode="day"][data-theme="emerald"]{--acc:#1f8a55;--acc2:#2ea96b;--accInk:#fff}
[data-mode="day"][data-theme="ruby"]{--acc:#b8344a;--acc2:#d14d62;--accInk:#fff}
[data-mode="day"][data-theme="ocean"]{--acc:#1f6fa8;--acc2:#2f8acb;--accInk:#fff}
/* table colour is its own setting (written after the themes, same specificity → it wins) */
[data-board="felt"]{--felt1:#1f6b45;--felt2:#0f4029;--feltInk:#f4f1e6;--feltLine:rgba(255,255,255,.10)}
[data-board="wood"]{--felt1:#8a5a32;--felt2:#5a3519;--feltInk:#fff6e8;--feltLine:rgba(255,235,200,.14)}
[data-board="contrast"]{--felt1:#0d3b8c;--felt2:#071f4d;--feltInk:#ffffff;--feltLine:rgba(255,255,255,.22);--cardEdge:#000;--red:#d0021b;--blk:#000}
[data-board="theme"]{--felt1:var(--panel2);--felt2:var(--bg);--feltInk:var(--ink);--feltLine:var(--line)}

body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;line-height:1.15}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------------- screens ---------------- */
.scr{display:none;min-height:100vh;min-height:100dvh;flex-direction:column}
.scr.on{display:flex;animation:scrIn .18s ease-out}
@keyframes scrIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar h2{font-size:22px;flex:1}
.back{min-width:48px;height:44px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-size:20px;font-weight:700}
.wrap{padding:16px;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h3{font-size:19px;margin-bottom:8px}
.btn{border:1.5px solid var(--acc);background:transparent;color:var(--acc);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px}
.btn.main{background:var(--acc);color:var(--accInk);font-size:18px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;min-height:44px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--accInk);font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw input[type=checkbox]{width:26px;height:26px;accent-color:var(--acc)}
.toast{position:fixed;inset-inline:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--panel);border:1px solid var(--acc);color:var(--ink);padding:12px 16px;border-radius:12px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(20px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.badge{text-align:center;font-size:12px;color:var(--muted);padding:18px 0 8px}
.badge b{color:var(--acc);font-weight:700}

/* ---------------- home ---------------- */
#home .hero{padding:28px 18px 10px;text-align:center;position:relative}
.logo{font-family:var(--disp);font-size:78px;line-height:1;color:var(--acc);letter-spacing:1px;display:inline-block;transform:rotate(-4deg);border:4px solid var(--acc);border-radius:18px;padding:6px 22px 12px;margin-top:8px}
.logo small{display:block;font-size:15px;letter-spacing:3px;font-family:var(--body);font-weight:700;margin-top:-2px}
.fan{display:flex;justify-content:center;margin:22px 0 6px;height:92px}
.fan .pc{margin-inline:-14px}
.fan .pc:nth-child(1){transform:rotate(-16deg) translateY(10px)}
.fan .pc:nth-child(2){transform:rotate(-6deg) translateY(2px)}
.fan .pc:nth-child(3){transform:rotate(6deg) translateY(2px)}
.fan .pc:nth-child(4){transform:rotate(16deg) translateY(10px)}
.modes{display:grid;gap:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:start;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;min-height:76px}
.mode .ic{font-size:30px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--panel2);flex:none}
.mode b{display:block;font-size:19px;font-family:var(--disp);font-weight:400}
.mode span{font-size:14px;color:var(--muted)}
.mode.prime{border-color:var(--acc)}
.mode.resume{border-style:dashed;border-color:var(--acc)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;min-height:64px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.tools button i{font-style:normal;font-size:22px}
.quickset{position:absolute;top:10px;inset-inline-end:12px;display:flex;gap:6px}
.quickset button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:18px}

/* ---------------- playing cards ---------------- */
.pc{--w:64px;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.11);background:var(--cardFace);border:1px solid var(--cardEdge);position:relative;flex:none;color:var(--blk);box-shadow:0 2px 6px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none;font-family:Georgia,'Times New Roman',serif;direction:ltr}
.pc.red{color:var(--red)}
.pc .ix{position:absolute;top:calc(var(--w)*.05);left:calc(var(--w)*.08);text-align:center;line-height:.95;font-weight:700;font-size:calc(var(--w)*.30)}
.pc .ix s{display:block;text-decoration:none;font-size:calc(var(--w)*.26)}
.pc .ix.b{top:auto;left:auto;bottom:calc(var(--w)*.05);right:calc(var(--w)*.08);transform:rotate(180deg)}
.pc .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.62);padding-top:calc(var(--w)*.06)}
.pc .face{position:absolute;inset:calc(var(--w)*.26) calc(var(--w)*.22);border:1.5px solid currentColor;border-radius:4px;display:grid;place-items:center;font-size:calc(var(--w)*.42);font-weight:700;opacity:.9}
.pc.jk{background:linear-gradient(160deg,var(--cardFace) 60%,#f1e3b8)}
.pc.jk .pip{font-size:calc(var(--w)*.5);color:#b07d12}
.pc.jk .jt{position:absolute;bottom:calc(var(--w)*.1);inset-inline:0;text-align:center;font:700 calc(var(--w)*.15)/1 var(--body);letter-spacing:1px;color:#8a5f00}
.pc .v{position:absolute;top:calc(var(--w)*.05);right:calc(var(--w)*.07);font:700 calc(var(--w)*.15)/1 var(--body);color:#8a8578}
.pc.cback{background:repeating-linear-gradient(45deg,var(--back1) 0 6px,color-mix(in srgb,var(--back2) 55%,var(--back1)) 6px 8px);border:2px solid var(--back2)}
.pc.cback::after{content:'';position:absolute;inset:18%;border:1.5px solid var(--back2);border-radius:4px;opacity:.7}

/* ---------------- game screen ---------------- */
#game{height:100vh;height:100dvh;min-height:0;overflow:hidden}
#game.on{display:grid;grid-template-rows:auto auto 1fr auto auto;grid-template-areas:"top" "opp" "table" "hand" "bar"}
.gtop{grid-area:top;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.gtop .back{min-width:42px;height:38px}
.gtop .ttl{flex:1;font-size:14px;color:var(--muted);line-height:1.2}
.gtop .ttl b{display:block;font-family:var(--disp);font-weight:400;color:var(--ink);font-size:17px}
.ib{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:17px}
.net{font-size:12px;padding:3px 8px;border-radius:20px;border:1px solid var(--line)}
.net.ok{border-color:var(--ok);color:var(--ok)} .net.warn{border-color:var(--bad);color:var(--bad)}
.opps{grid-area:opp;display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:var(--panel)}
.opp{flex:1 1 0;min-width:84px;max-width:200px;border:1.5px solid var(--line);border-radius:12px;padding:5px 7px;position:relative;background:var(--panel2)}
.opp.turn{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent)}
.opp.out{opacity:.45}
.opp .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.opp .sc{font-size:12px;color:var(--muted)}
.opp .mini{display:flex;margin-top:3px;min-height:26px;align-items:center}
.opp .mini .pc{--w:18px;margin-inline-end:-8px;box-shadow:none}
.opp .mini .kn{--w:20px;margin-inline-end:-4px}
.opp .cnt{font-size:12px;font-weight:700;margin-inline-start:12px}
.opp .talk{position:absolute;top:-6px;inset-inline-end:-4px;background:var(--ok);color:#000;border-radius:12px;font-size:11px;padding:1px 6px;font-weight:700}
.opp .off{color:var(--bad);font-size:11px}
.bubble{position:absolute;top:100%;inset-inline-start:4px;z-index:20;background:var(--cardFace);color:#111;border-radius:12px;padding:5px 10px;font-size:14px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap;margin-top:4px;animation:pop .25s ease-out}
.bubble.big{font-size:30px;padding:0 6px;background:transparent;box-shadow:none}
.bubble.vm{cursor:pointer;background:var(--acc);color:var(--accInk)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

.table{grid-area:table;position:relative;background:radial-gradient(ellipse at 50% 40%,var(--felt1),var(--felt2) 78%);color:var(--feltInk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;min-height:0;overflow:hidden;touch-action:manipulation}
.table::before{content:'';position:absolute;inset:10px;border:1.5px solid var(--feltLine);border-radius:24px;pointer-events:none}
.tmid{display:flex;align-items:center;justify-content:center;gap:22px;width:100%}
.deckbox,.topbox{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:14px;padding:6px;position:relative}
.deckbox .lb,.topbox .lb{font-size:12px;opacity:.85}
.stack{position:relative}
.stack .pc{--w:var(--tw)}
.stack .pc:nth-child(1){position:absolute;top:4px;left:4px}
.stack .pc:nth-child(2){position:absolute;top:2px;left:2px}
.stack .pc:nth-child(3){position:relative}
.topcards{display:flex;align-items:center;min-height:calc(var(--tw)*1.42)}
.topcards .pc{--w:var(--tw);margin-inline-end:calc(var(--tw)*-0.38)}
.topcards .pc:last-child{margin-inline-end:0}
.topcards{direction:ltr}
.can{outline:3px solid transparent;transition:outline-color .15s,transform .15s}
.go .can{outline-color:var(--acc2);outline-offset:2px;cursor:pointer}
.go .can.pick{transform:translateY(-6px)}
.deckbox.can{outline-offset:4px}
.drop{animation:drop .32s ease-out}
@keyframes drop{from{transform:translateY(-26px) scale(1.08);opacity:0}to{transform:none;opacity:1}}
.status{font-size:15px;text-align:center;min-height:24px;background:rgba(0,0,0,.28);padding:4px 14px;border-radius:20px;max-width:94%}
.lastact{font-size:13px;opacity:.85;text-align:center;min-height:20px}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:30}
.stamp b{font-family:var(--disp);font-weight:400;font-size:min(26vw,150px);color:var(--acc2);border:8px solid currentColor;border-radius:24px;padding:0 26px 14px;transform:rotate(-8deg);text-shadow:0 4px 0 rgba(0,0,0,.35);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;background:rgba(0,0,0,.25)}
.stamp b.as{color:#ff6b5e}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}

.hand{grid-area:hand;padding:10px 6px 4px;background:var(--panel);border-top:1px solid var(--line);position:relative}
.hinfo{display:flex;justify-content:space-between;align-items:center;padding:0 8px 6px;font-size:14px;min-height:28px;gap:8px}
.hinfo .sum{font-family:var(--disp);font-size:20px}
.hinfo .sum.low{color:var(--ok)}
.combo{font-size:13px;padding:2px 10px;border-radius:20px;border:1px solid var(--line)}
.combo.ok{border-color:var(--ok);color:var(--ok)} .combo.bad{border-color:var(--bad);color:var(--bad)}
.cards{display:flex;justify-content:center;direction:ltr;padding-top:18px;min-height:calc(var(--hw)*1.42 + 22px)}
.cards .pc{--w:var(--hw);cursor:pointer;transition:transform .14s;margin-inline:3px;touch-action:manipulation}
.cards.tight .pc{margin-inline:calc(var(--hw)*-0.16)}
.cards .pc.sel{transform:translateY(-18px);box-shadow:0 0 0 3px var(--acc2),0 8px 16px rgba(0,0,0,.45)}
.cards .pc.new{animation:newc .9s ease-out}
.cards .pc.hintc{box-shadow:0 0 0 3px #59c3ff,0 8px 16px rgba(0,0,0,.45)}
@keyframes newc{0%{box-shadow:0 0 0 4px var(--acc2)}100%{box-shadow:0 2px 6px rgba(0,0,0,.35)}}
.cards.wait .pc{cursor:default}
.gbar{grid-area:bar;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);align-items:stretch}
.gbar .btn{min-height:50px;padding:8px 10px}
.yv{flex:1.4;font-family:var(--disp);font-size:24px!important;font-weight:400!important;letter-spacing:.5px}
.yv:not(:disabled){animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 30%,transparent)}}
.voice{display:flex;gap:6px;padding:6px 10px;background:var(--panel2);border-top:1px solid var(--line);align-items:center}
.voice .btn{min-height:44px;padding:6px 10px;font-size:14px}
.ptt{flex:1.6;user-select:none;-webkit-user-select:none;touch-action:none}
.ptt.on{background:var(--ok)!important;color:#000!important;border-color:var(--ok)!important}
.vbtn.on{background:var(--acc);color:var(--accInk)}
.rec.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.emo{position:absolute;bottom:100%;inset-inline:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:40;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.emo button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:15px;min-height:40px}
.emo button.e{font-size:22px;padding:4px 8px}

/* landscape: table on one side, hand + controls on the other */
@media (orientation:landscape) and (max-height:560px){
  #game.on{grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto 1fr auto auto;grid-template-areas:"top top" "opp hand" "table hand" "table bar" "table voice"}
  .voice{grid-area:voice}
  .hand{border-top:0;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
  .gbar{border-inline-start:1px solid var(--line)}
  .opps{padding:4px 8px}
}

/* ---------------- overlays ---------------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px}
.ov .box{background:var(--panel);border:1px solid var(--acc);border-radius:18px;max-width:560px;width:100%;max-height:calc(100dvh - 28px);overflow:auto;padding:18px}
.ov .box h2{font-size:26px;margin-bottom:6px}
.pass{background:var(--bg)!important;flex-direction:column;gap:18px;text-align:center}
.pass h2{font-size:32px;color:var(--acc)}
.res{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.rp{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel2)}
.rp.win{border-color:var(--ok)} .rp.lose{border-color:var(--bad)}
.rp .top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.rp .cs{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap;direction:ltr;justify-content:flex-end}
.rp .cs .pc{--w:30px}
.tag{font-size:12px;padding:1px 8px;border-radius:12px;background:var(--acc);color:var(--accInk);font-weight:700;margin-inline-start:6px}
.tag.red{background:var(--bad);color:#fff}
table.sc{width:100%;border-collapse:collapse;font-size:14px}
table.sc th,table.sc td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
table.sc th{color:var(--muted);font-weight:500}
table.sc tr.tot td{font-weight:700;color:var(--acc)}
.code{font-family:var(--disp);font-size:52px;letter-spacing:6px;color:var(--acc);text-align:center;direction:ltr}
.seats{display:flex;flex-direction:column;gap:6px}
.seat{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.seat .d{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.seat .d.no{background:var(--bad)}
.seat b{flex:1}
.guide .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}

<script>
/* =====================================================================
   YanivNest engine — pure rules, no DOM. Runs in the browser and in Node.
   Cards: 0..51 = suit*13 + (rank-1)  (suits ♠♥♦♣), 52/53 = jokers (value 0).
   The engine owns the full state (deck + every hand). Players only ever get
   view(G, seat): their own hand + public information.
   ===================================================================== */
const YE = (() => {
  const isJ = c => c >= 52;
  const suit = c => isJ(c) ? -1 : Math.floor(c / 13);
  const rank = c => isJ(c) ? 0 : c % 13 + 1;
  const val = c => isJ(c) ? 0 : Math.min(10, c % 13 + 1);
  const sum = h => { let s = 0; for (const c of h) s += val(c); return s; };
  const DEFAULTS = { limit: 7, assaf: 30, max: 100, halve: true, hand: 5, jokers: 2 };

  /* ---------- seeded RNG (state is one 32-bit int → saved with the round) ---------- */
  function rnext(R) {
    R.rs = (R.rs + 0x6D2B79F5) >>> 0; let t = R.rs;
    t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function shuffle(a, R) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnext(R) * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

  /* ---------- combinations ---------- */
  // single · set (same rank, jokers wild) · run (3+ same suit in a row, jokers fill gaps; ace is low)
  function classify(cards) {
    const n = cards.length; if (!n) return null;
    if (new Set(cards).size !== n) return null;
    if (n === 1) return { kind: 'single', order: cards.slice() };
    const nat = cards.filter(c => !isJ(c)), jk = cards.filter(isJ);
    if (nat.length === 0 || nat.every(c => rank(c) === rank(nat[0]))) return { kind: 'set', order: nat.concat(jk) };
    if (n < 3 || !nat.every(c => suit(c) === suit(nat[0]))) return null;
    const rs = nat.map(rank).sort((a, b) => a - b);
    for (let i = 1; i < rs.length; i++) if (rs[i] === rs[i - 1]) return null;
    const lo = rs[0], hi = rs[rs.length - 1];
    if (hi - lo + 1 - rs.length > jk.length) return null;
    const byR = {}; nat.forEach(c => byR[rank(c)] = c);
    const order = []; let j = 0;
    for (let r = lo; r <= hi; r++) order.push(byR[r] != null ? byR[r] : jk[j++]);
    let top = hi, bot = lo;
    while (j < jk.length && top < 13) { order.push(jk[j++]); top++; }
    while (j < jk.length && bot > 1) { order.unshift(jk[j++]); bot--; }
    if (j < jk.length) return null;
    return { kind: 'run', order };
  }
  // which cards of the previous throw may be taken: a run → only its two ends; otherwise any card
  function takeable(top) {
    if (!top || !top.order.length) return [];
    if (top.kind === 'run') return top.order.length > 1 ? [top.order[0], top.order[top.order.length - 1]] : top.order.slice();
    return top.order.slice();
  }
  // every legal throw from a hand (hands are small: ≤ 2^7 subsets)
  function throws(hand) {
    const out = [], n = hand.length;
    for (let m = 1; m < (1 << n); m++) {
      const cs = []; for (let i = 0; i < n; i++) if (m & (1 << i)) cs.push(hand[i]);
      const k = classify(cs); if (k) out.push({ cards: cs, kind: k.kind, pts: sum(cs) });
    }
    return out;
  }
  function sortHand(h) { return h.slice().sort((a, b) => (val(a) - val(b)) || (rank(a) - rank(b)) || (a - b)); }

  /* ---------- game ---------- */
  function newGame(players, cfg, seed) {
    const G = {
      v: 1, cfg: Object.assign({}, DEFAULTS, cfg || {}),
      players: players.map(p => ({ name: p.name || '', kind: p.kind || 'human', lvl: p.lvl || 0, score: 0, out: false })),
      rn: 0, starter: 0, seed: (seed >>> 0) || ((Math.random() * 4294967296) >>> 0), history: [], over: false, winner: null, round: null
    };
    G.starter = G.seed % G.players.length;
    startRound(G);
    return G;
  }
  const active = G => G.players.map((p, i) => p.out ? -1 : i).filter(i => i >= 0);
  function nextActive(G, s) { const n = G.players.length; for (let k = 1; k <= n; k++) { const t = (s + k) % n; if (!G.players[t].out) return t; } return s; }

  function startRound(G) {
    G.rn++;
    const seed = (G.seed + Math.imul(G.rn, 0x9E3779B1)) >>> 0;
    const R = { seed, rs: seed, pre: { sc: G.players.map(p => p.score), out: G.players.map(p => p.out) }, deck: [], hands: G.players.map(() => []), known: G.players.map(() => []), pile: [], turn: G.starter, starter: G.starter, acts: [], end: null, turns: 0 };
    const deck = []; for (let c = 0; c < 52; c++) deck.push(c); for (let j = 0; j < G.cfg.jokers; j++) deck.push(52 + j);
    shuffle(deck, R); R.deck = deck;
    if (G.players[R.turn].out) R.turn = nextActive(G, R.turn);
    for (let k = 0; k < G.cfg.hand; k++) for (const s of active(G)) R.hands[s].push(R.deck.pop());
    R.pile.push({ order: [R.deck.pop()], kind: 'single', by: -1 });
    G.round = R;
    return R;
  }
  function topGroup(R) { return R.pile[R.pile.length - 1]; }
  function reshuffle(R) {
    if (R.deck.length) return;
    const keep = R.pile.pop(), cards = [];
    for (const g of R.pile) for (const c of g.order) cards.push(c);
    R.pile = [keep]; R.deck = shuffle(cards, R);
  }

  // a turn: throw `cards`, then take 'd' (deck) or one card of the previous throw
  function play(G, seat, cards, take) {
    const R = G.round;
    if (!R || R.end || G.over) return { ok: false, err: 'phase' };
    if (R.turn !== seat) return { ok: false, err: 'turn' };
    const hand = R.hands[seat];
    if (!cards || !cards.length || !cards.every(c => hand.includes(c))) return { ok: false, err: 'cards' };
    const k = classify(cards); if (!k) return { ok: false, err: 'combo' };
    const prev = topGroup(R), opts = takeable(prev);
    if (take !== 'd' && !opts.includes(take)) return { ok: false, err: 'take' };
    R.hands[seat] = hand.filter(c => !cards.includes(c));
    R.known[seat] = R.known[seat].filter(c => !cards.includes(c));
    let drew;
    if (take === 'd') { reshuffle(R); drew = R.deck.pop(); }
    else { drew = take; prev.order = prev.order.filter(c => c !== take); R.known[seat].push(take); if (!prev.order.length) R.pile.pop(); }
    R.hands[seat].push(drew);
    R.pile.push({ order: k.order, kind: k.kind, by: seat });
    if (!R.deck.length) reshuffle(R);
    R.acts.push({ s: seat, t: k.order, k: take });
    R.turns++; R.turn = nextActive(G, seat);
    return { ok: true, drew };
  }

  function canYaniv(G, seat) { const R = G.round; return !!R && !R.end && !G.over && R.turn === seat && sum(R.hands[seat]) <= G.cfg.limit; }
  function yaniv(G, seat) {
    if (!canYaniv(G, seat)) return { ok: false, err: 'yaniv' };
    const R = G.round, act = active(G), sums = R.hands.map(sum), mine = sums[seat];
    let assaf = null;
    for (let k = 1; k < G.players.length; k++) {            // closest in turn order after the caller wins ties
      const t = (seat + k) % G.players.length;
      if (G.players[t].out) continue;
      if (sums[t] <= mine && (assaf == null || sums[t] < sums[assaf])) assaf = t;
    }
    const add = G.players.map(() => 0), before = G.players.map(p => p.score), halved = [], outNow = [];
    for (const s of act) {
      if (s === seat) add[s] = assaf == null ? 0 : mine + G.cfg.assaf;
      else if (s === assaf) add[s] = 0;
      else add[s] = sums[s];
    }
    for (const s of act) {
      const p = G.players[s]; p.score += add[s];
      if (G.cfg.halve && add[s] > 0 && p.score > 0 && p.score % 50 === 0) { p.score -= 50; halved.push(s); }
      if (p.score > G.cfg.max) { p.out = true; outNow.push(s); }
    }
    R.acts.push({ s: seat, y: 1 });
    (G.log || (G.log = [])).push({ rn: G.rn, st: R.starter, sc: R.pre.sc, out: R.pre.out, acts: R.acts.slice() });
    R.end = { caller: seat, assaf, sums, add, before, after: G.players.map(p => p.score), halved, outNow, hands: R.hands.map(h => h.slice()) };
    G.history.push({ rn: G.rn, caller: seat, assaf, add: add.slice(), after: R.end.after.slice() });
    G.starter = assaf == null ? seat : assaf;
    const left = active(G);
    if (left.length <= 1) { G.over = true; G.winner = left.length ? left[0] : lowest(G); }
    return { ok: true, assaf };
  }
  function lowest(G) { let b = 0; G.players.forEach((p, i) => { if (p.score < G.players[b].score) b = i; }); return b; }
  function nextRound(G) { if (G.over || !G.round || !G.round.end) return false; startRound(G); return true; }
  // stop the match early (e.g. the only human was knocked out vs the computer)
  function finish(G) { if (G.over) return; G.over = true; const left = active(G); let b = left[0]; for (const s of left) if (G.players[s].score < G.players[b].score) b = s; G.winner = b; }

  /* ---------- what one seat may know ---------- */
  function view(G, seat) {
    const R = G.round, pileCards = [];
    for (let i = 0; i < R.pile.length - 1; i++) for (const c of R.pile[i].order) pileCards.push(c);
    const top = topGroup(R);
    return {
      cfg: G.cfg, me: seat, rn: G.rn, turn: R.turn, starter: R.starter, turns: R.turns,
      players: G.players.map((p, i) => ({ name: p.name, kind: p.kind, lvl: p.lvl, score: p.score, out: p.out, count: R.hands[i].length, known: R.known[i].slice() })),
      hand: seat >= 0 ? sortHand(R.hands[seat]) : [],
      top: { order: top.order.slice(), kind: top.kind, by: top.by }, under: pileCards, deck: R.deck.length,
      last: R.acts.length ? R.acts[R.acts.length - 1] : null,
      end: R.end, over: G.over, winner: G.winner, history: G.history
    };
  }
  // the private information of `seat` is never in another seat's view (used by the tests)
  function unseen(V) {
    const seen = new Set(V.hand.concat(V.top.order, V.under));
    V.players.forEach((p, i) => { if (i !== V.me) p.known.forEach(c => seen.add(c)); });
    const out = []; for (let c = 0; c < 52 + V.cfg.jokers; c++) if (!seen.has(c)) out.push(c);
    return out;
  }

  /* ---------- replay: seed + actions rebuild every state ---------- */
  function replayRound(G0players, cfg, gameSeed, rn, starter, scores, outs, acts) {
    const G = { v: 1, cfg, players: G0players.map((p, i) => ({ name: p.name, kind: p.kind, lvl: p.lvl, score: scores[i], out: outs[i] })), rn: rn - 1, starter, seed: gameSeed, history: [], over: false, winner: null, round: null };
    startRound(G);
    const frames = [snapshot(G)];
    for (const a of acts) { if (a.y) yaniv(G, a.s); else play(G, a.s, a.t, a.k); frames.push(snapshot(G)); }
    return frames;
  }
  function snapshot(G) { const R = G.round; return { hands: R.hands.map(h => sortHand(h)), top: JSON.parse(JSON.stringify(topGroup(R))), deck: R.deck.length, turn: R.turn, end: R.end, last: R.acts[R.acts.length - 1] || null }; }

  return { isJ, suit, rank, val, sum, classify, takeable, throws, sortHand, newGame, startRound, nextRound, play, yaniv, canYaniv, finish, view, unseen, active, nextActive, replayRound, DEFAULTS, shuffle, rnext };
})();


/* =====================================================================
   YanivNest AI — every decision is made from view(G, seat) only:
   own hand + what everyone saw on the table. It never peeks.
   Levels: 0 easy · 1 medium · 2 hard · 3 expert · 9 = "human bot" (tests only)
   ===================================================================== */
const YAI = (() => {
  const E = (typeof YE !== 'undefined') ? YE : require('./engine.js');
  const memo = new Map();
  // the most points this hand can throw in one turn (prefer more cards on a tie)
  function best(hand) {
    if (!hand.length) return { pts: 0, n: 0 };
    const key = hand.slice().sort((a, b) => a - b).join(',');
    let r = memo.get(key); if (r) return r;
    r = { pts: -1, n: 0 };
    for (const t of E.throws(hand)) if (t.pts > r.pts || (t.pts === r.pts && t.cards.length > r.n)) r = { pts: t.pts, n: t.cards.length };
    if (memo.size > 300000) memo.clear();
    memo.set(key, r); return r;
  }
  const W = {
    2: { t: 0.8, n: 1.2, beta: 0.06, risk: 0.20, gift: 0.25 },
    3: { t: 0.8, n: 1.2, beta: 0.06, risk: 0.12, gift: 0.5, aware: 1 }
  };
  if (typeof process !== 'undefined' && process.env && process.env.W3) Object.assign(W[3], JSON.parse(process.env.W3));
  function evalH(H, w) { const b = best(H); return E.sum(H) - w.t * b.pts + w.n * H.length; }
  const combos = (rest, c) => best(rest.concat(c)).pts > E.val(c) + best(rest).pts - 0.001 && best(rest.concat(c)).n > 1;
  function maxThrow(hand, rnd) {
    const ts = E.throws(hand); let b = null;
    for (const t of ts) if (!b || t.pts > b.pts || (t.pts === b.pts && t.cards.length > b.cards.length) || (t.pts === b.pts && t.cards.length === b.cards.length && rnd() < .5)) b = t;
    return b;
  }
  const opps = V => V.players.map((p, i) => ({ p, i })).filter(o => o.i !== V.me && !o.p.out);

  /* ---------- Yaniv: how likely is an Assaf? (Monte-Carlo over the cards I can't see) ---------- */
  function assafProb(V, beta, N, rnd) {
    const mine = E.sum(V.hand), pool = E.unseen(V), os = opps(V);
    const wts = pool.map(c => Math.exp(-beta * E.val(c)));
    let hits = 0;
    for (let s = 0; s < N; s++) {
      const used = new Uint8Array(pool.length); let hit = false;
      for (const o of os) {
        let tot = E.sum(o.p.known), u = o.p.count - o.p.known.length;
        if (tot > mine) continue;
        for (let k = 0; k < u && tot <= mine; k++) {
          let W = 0; for (let i = 0; i < pool.length; i++) if (!used[i]) W += wts[i];
          let r = rnd() * W, pick = -1;
          for (let i = 0; i < pool.length; i++) { if (used[i]) continue; r -= wts[i]; if (r <= 0) { pick = i; break; } }
          if (pick < 0) for (let i = pool.length - 1; i >= 0; i--) if (!used[i]) { pick = i; break; }
          used[pick] = 1; tot += E.val(pool[pick]);
        }
        if (tot <= mine) { hit = true; break; }
      }
      if (hit) hits++;
    }
    return hits / N;
  }
  // a rough human guess: known cards + ~`per` points for each card I can't see
  function guessSafe(V, per, margin) {
    const mine = E.sum(V.hand);
    return opps(V).every(o => E.sum(o.p.known) + per * (o.p.count - o.p.known.length) > mine + margin);
  }

  /* ---------- simple players ---------- */
  function simplePlay(V, rnd, lowTake, useCombo) {
    const opts = E.takeable(V.top);
    let t = maxThrow(V.hand, rnd);
    if (lowTake === 2 && rnd() < .25) { const ts = E.throws(V.hand); t = ts[Math.floor(rnd() * ts.length)]; }
    const rest = V.hand.filter(c => !t.cards.includes(c));
    let take = 'd', bv = 99;
    for (const o of opts) {
      const v = E.val(o);
      if ((v <= lowTake || (useCombo && combos(rest, o))) && v < bv) { take = o; bv = v; }
    }
    return { t: t.cards, k: take };
  }

  /* ---------- evaluated play (hard / expert) ---------- */
  function evalPlay(V, w, rnd) {
    const opts = E.takeable(V.top), pool = E.unseen(V);
    const nextSeat = (() => { for (let k = 1; k <= V.players.length; k++) { const t = (V.me + k) % V.players.length; if (!V.players[t].out) return t; } return V.me; })();
    const nx = V.players[nextSeat];
    let sample = pool;
    if (pool.length > 28) { sample = pool.slice(); E.shuffle(sample, { rs: (rnd() * 4294967296) >>> 0 }); sample = sample.slice(0, 28); }
    let bestP = null;
    for (const t of E.throws(V.hand)) {
      const rest = V.hand.filter(c => !t.cards.includes(c));
      let gift = 0;
      if (w.gift && nextSeat !== V.me) {                 // what the next player could pick up from this throw
        const k = E.classify(t.cards), ends = E.takeable({ order: k.order, kind: k.kind });
        const close = nx.count <= 3 ? 1.5 : 1;

  rulesHTML: '<h3>המטרה</h3><p>להישאר עם סכום כמה שיותר נמוך ביד, ולקרוא "יניב" בזמן הנכון. אס = 1, 2–10 לפי המספר, נסיך / מלכה / מלך = 10, ג׳וקר = 0.</p><h3>תור</h3><p>זורקים אחת מאלה: קלף בודד · סט (שניים ומעלה מאותו מספר, ג׳וקר יכול להשלים) · רצף של 3 ומעלה באותה צורה (אס נמוך בלבד, ג׳וקר ממלא חור). ואז לוקחים קלף אחד: מהחפיסה, או אחד מהקלפים שהשחקן הקודם זרק. מסט — כל קלף; מרצף — רק הקצוות.</p><h3>יניב</h3><p>בתחילת התור, אם הסכום שלך {l} או פחות, אפשר לקרוא יניב במקום לשחק. כל הקלפים נחשפים.</p><ul><li>אף אחד לא נמוך או שווה לך — אתה מקבל 0, כל השאר את הסכום שלהם.</li><li><b>אסף:</b> למישהו סכום שווה או נמוך יותר — הוא מקבל 0, ואתה מקבל את הסכום שלך ועוד {a}. אם כמה עשו אסף, הנמוך מביניהם מנצח (בתיקו — הקרוב אחריך בתור).</li></ul><h3>ניקוד</h3><p>מי שעובר את {m} נקודות יוצא. ציון שנוחת בדיוק על 50, 100 או 150 יורד ב-50 (אפשר לכבות). האחרון שנשאר במשחק מנצח. את הסיבוב הבא פותח מי שניצח בסיבוב.</p><h3>חפיסה</h3><p>כשהחפיסה נגמרת, הקלפים שנזרקו מתערבבים לחפיסה חדשה (חוץ מהזריקה האחרונה).</p>'

/* ---------- replays (seed + moves → every state) ---------- */
function saveReplay() {
  const G = CUR.G; if (!G || !G.log) return;
  const rec = { id: CUR.id, date: Date.now(), mode: CUR.mode, players: G.players.map(p => ({ name: p.name, kind: p.kind, lvl: p.lvl })), cfg: G.cfg, seed: G.seed, log: G.log, winner: G.winner, me: CUR.mode === 'hot' ? 0 : CUR.me, final: G.players.map(p => p.score) };
  addReplay(rec);

}
function addReplay(rec) { REPLAYS = [rec].concat(REPLAYS.filter(r => r.id !== rec.id)).slice(0, 10); LS.set('replays', REPLAYS); }
function openReplay(rec) {
  let ri = 0, fi = 0, frames = build(0);
  function build(i) { const L = rec.log[i]; return YE.replayRound(rec.players, rec.cfg, rec.seed, L.rn, L.st, L.sc, L.out, L.acts); }
  const o = overlay('<div class="rv" id="rvBox"></div>');
  function draw() {
    const L = rec.log[ri], f = frames[fi], a = f.last;
    const nm = s => esc(rec.players[s].name || T('player') + ' ' + (s + 1));
    let line = fi === 0 ? T('rvDeal') : a.y ? T('rvYaniv', { n: nm(a.s) }) : T('actLine', { who: nm(a.s), what: cardsTxt(a.t), took: a.k === 'd' ? T('fromDeck') : T('took', { c: cardTxt(a.k) }) });
    if (f.end) line += ' · ' + (f.end.assaf != null ? T('assafLine', { a: nm(f.end.assaf), c: nm(f.end.caller), n: f.end.sums[f.end.caller] }) : T('yanivLine', { c: nm(f.end.caller), n: f.end.sums[f.end.caller] }));
    o.querySelector('#rvBox').innerHTML = '<h2>🎬 ' + T('roundN', { n: L.rn }) + ' <span class="muted" style="font-size:15px">(' + (ri + 1) + '/' + rec.log.length + ')</span></h2>'
      + '<p style="min-height:48px">' + line + '</p><div class="hands">' + f.hands.map((h, s) => h.length || !L.out[s] ? '<div class="rp' + (f.turn === s && !f.end ? ' win' : '') + '"><div class="top"><span>' + nm(s) + '</span><span class="ltr">' + YE.sum(h) + '</span></div><div class="cs">' + h.map(c => cardHTML(c)).join('') + '</div></div>' : '').join('') + '</div>'
      + '<div class="rp"><div class="top"><span>' + T('onTable') + '</span><span>' + T('deckN', { n: f.deck }) + '</span></div><div class="cs">' + f.top.order.map(c => cardHTML(c)).join('') + '</div></div>'
      + '<div class="row" style="margin-top:12px"><button class="btn" data-r="pr">⏮</button><button class="btn" data-r="p">◀</button><span class="ltr" style="text-align:center">' + fi + '/' + (frames.length - 1) + '</span><button class="btn" data-r="n">▶</button><button class="btn" data-r="nr">⏭</button></div>'
      + '<button class="btn wide" style="margin-top:8px" data-r="x">' + T('close') + '</button>';
  }
  o.onclick = e => {
    const b = e.target.closest('[data-r]'); if (!b) return; const r = b.dataset.r;
    if (r === 'x') return closeOv(o);
    if (r === 'n' && fi < frames.length - 1) fi++;
    else if (r === 'p' && fi > 0) fi--;
    else if (r === 'nr' && ri < rec.log.length - 1) { ri++; frames = build(ri); fi = 0; }
    else if (r === 'pr' && ri > 0) { ri--; frames = build(ri); fi = 0; }
    draw();
  };
  draw();
}

/* =====================================================================
   YanivNest — online over NestLink 1.1
   The host is the dealer: it owns the full game and sends every guest ONLY
   its own view (sendTo). Guests send intents; the host validates and applies.
   ===================================================================== */
let LINK = null;
let NET = LS.get('net', null);          // {role, sess, gid, map, bots, cfg, lobby, G (host), V (guest)}
let netSaveT = null;
function saveNet() {
  if (!NET) { LS.del('net'); return; }
  if (CUR && CUR.mode === 'net') { if (CUR.host) NET.G = CUR.G; else NET.V = CUR.V; NET.gid = CUR.id; }
  LS.set('net', NET);
}
const saveNetSoon = () => { clearTimeout(netSaveT); netSaveT = setTimeout(saveNet, 250); };
const netSend = d => { if (LINK) LINK.sendTo(0, d); };
const netSendAll = d => { if (LINK) LINK.send(d); };
const hostSide = () => NET && NET.role === 'host';
const gameSeatOf = link => NET && NET.map && NET.map[link] != null ? NET.map[link] : -1;
function linkOf(gs) { if (!NET || !NET.map) return null; for (const k in NET.map) if (NET.map[k] === gs) return +k; return null; }
function netInfo(gs) {
  if (!CUR || CUR.mode !== 'net') return null;
  const L = linkOf(gs); if (L == null) return null;
  const r = (LINK ? LINK.roster : []).find(p => p.seat === L);
  return { online: L === (LINK && LINK.seat) ? true : !!(r && r.online), talking: !!CUR.talk[gs] };
}
// keep only the newest message of a type in each resend buffer (views are full snapshots)
function compact(type) {
  const S = LINK && LINK.session; if (!S || !S.links) return;
  for (const k in S.links) { const out = S.links[k].out; let seen = false; for (let i = out.length - 1; i >= 0; i--) { const d = out[i].d; if (d && d.type === type) { if (seen) out[i].d = { type: 'x' }; seen = true; } } }
}

function netInit() {
  if (LINK) return LINK;
  LINK = NestLink.create({
    app: 'yanivnest', version: APP_VERSION, maxPlayers: 6,
    name: () => ST.name || T('player'),
    persist: s => { if (!NET) return; NET.sess = s; saveNet(); },          // immediately: the message counters must survive a refresh

function refreshNetUI() { if (SCREEN === 'online') renderNet(); if (SCREEN === 'game' && CUR && CUR.mode === 'net') renderTop(curView()); const p = $('#netPill'); if (p) { const st = LINK ? LINK.status : 'off'; p.textContent = T('st_' + st); p.className = 'net ' + (st === 'open' ? 'ok' : st === 'off' || st === 'waiting' ? '' : 'warn'); } }

/* ---------- host: lobby ---------- */
function lobbyList() {
  const hum = (LINK ? LINK.roster : []).slice().sort((a, b) => a.seat - b.seat).map(p => ({ kind: 'human', link: p.seat, name: p.seat === 0 ? (ST.name || T('host')) : (p.name || T('player') + ' ' + (p.seat + 1)), online: p.seat === 0 ? true : !!p.online }));
  const bots = (NET.bots || []).map((l, i) => ({ kind: 'bot', lvl: l, name: botName(i + 1), online: true }));
  return hum.concat(bots).slice(0, 6);
}
function lobbyChanged() {
  if (!hostSide() || !LINK) return;
  NET.lobby = { list: lobbyList(), cfg: NET.cfg, playing: !!(CUR && CUR.mode === 'net' && CUR.G && !CUR.G.over) };
  netSendAll({ type: 'lobby', lobby: NET.lobby }); compact('lobby'); saveNetSoon(); refreshNetUI();
}
function netHost() {
  if (!ST.name) { toast(T('nameFirst')); $('#netName') && $('#netName').focus(); return; }
  netInit(); if (CUR && CUR.mode === 'net') CUR = null;
  NET = { role: 'host', sess: null, gid: null, map: {}, bots: [], cfg: Object.assign({}, ST.rules), lobby: null };
  LINK.host(); refreshNetUI();
}
function netJoin(code) {
  code = (code || '').trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(code)) { toast(T('badCode')); return; }
  if (!ST.name) { toast(T('nameFirst')); $('#netName') && $('#netName').focus(); return; }
  netInit(); if (CUR && CUR.mode === 'net') CUR = null;
  NET = { role: 'guest', sess: null, gid: null, map: {}, lobby: null, V: null };
  LINK.join(code); refreshNetUI();
}
function netStart() {
  const list = lobbyList();
  if (list.filter(x => x.kind === 'human').length < 2) { toast(T('needFriend')); return; }
  NET.map = {}; list.forEach((x, i) => { if (x.kind === 'human') NET.map[x.link] = i; });
  const G = YE.newGame(list.map(x => ({ name: x.name, kind: x.kind, lvl: x.lvl })), NET.cfg);
  NET.gid = 'n' + Date.now().toString(36);
  newCur('net', G, 0, { id: NET.gid });
  closeAllOv(); show('game'); lobbyChanged(); after();
}
function netRestart() {
  const G0 = CUR.G; NET.gid = 'n' + Date.now().toString(36);
  const G = YE.newGame(G0.players.map(p => ({ name: p.name, kind: p.kind, lvl: p.lvl })), G0.cfg);
  newCur('net', G, 0, { id: NET.gid }); closeAllOv(); show('game'); after(); lobbyChanged();
}
function pushViews() {
  if (!LINK || !CUR || !CUR.G) return;
  for (const p of LINK.roster) {
    if (p.seat === 0) continue;
    const gs = gameSeatOf(p.seat);
    LINK.sendTo(p.seat, { type: 'view', gid: CUR.id, lk: NET.map, V: YE.view(CUR.G, gs) });
  }
  compact('view'); saveNetSoon();
}

/* ---------- messages ---------- */
function onNetMsg(d, from) {
  if (!d || !NET) return;
  if (hostSide()) {
    if (d.type === 'act' && CUR && CUR.mode === 'net' && CUR.G) {
      const gs = gameSeatOf(from); if (d.gid !== CUR.id || gs < 0) return;
      const a = d.a, r = a.y ? YE.yaniv(CUR.G, gs) : YE.play(CUR.G, gs, a.t, a.k);
      if (!r.ok) { pushViews(); return; }
      beep(a.y ? 'yaniv' : 'card'); after();
    }
    return;
  }
  // guest
  if (d.type === 'lobby') { NET.lobby = d.lobby; saveNetSoon(); refreshNetUI(); return; }
  if (d.type === 'view') {
    NET.gid = d.gid; NET.map = d.lk || {};
    if (!CUR || CUR.mode !== 'net' || CUR.id !== d.gid) { newCur('net', null, d.V.me, { host: false, id: d.gid }); if (SCREEN === 'online') { closeAllOv(); show('game'); } }
    CUR.V = d.V; CUR.me = d.V.me; CUR.pending = false; NET.V = d.V; saveNetSoon();
    if (SCREEN === 'game') render();
    return;
  }
  if (d.type === 'rep') { const rec = Object.assign({}, d.rec, { me: CUR ? CUR.me : 0 }); addReplay(rec); return; }
  if (d.type === 'bye') { toast(T('hostLeft'), 4000); netLeave(false); if (SCREEN === 'game' || SCREEN === 'online') { closeAllOv(); show('home'); renderHome(); } }
}
function netLeave(sayBye) {
  const L = LINK;
  if (L && sayBye && hostSide()) { L.send({ type: 'bye' }); setTimeout(() => L.close(), 400); } else if (L) L.close();
  LINK = null; NET = null; LS.del('net');
  if (CUR && CUR.mode === 'net') CUR = null;
}
function netResume() {
  if (!NET || !NET.sess) return false;
  netInit(); LINK.resume(NET.sess);
  if (NET.role === 'host' && NET.G) { newCur('net', NET.G, 0, { id: NET.gid }); closeAllOv(); show('game'); after(); }
  else if (NET.role === 'guest' && NET.V) { newCur('net', null, NET.V.me, { host: false, id: NET.gid, V: NET.V }); closeAllOv(); show('game'); render(); }
  else { show('online'); renderNet(); }
  return true;
}

  B.querySelectorAll('[data-k]').forEach(c => c.onchange = () => { ST[c.dataset.k] = c.checked; saveST(); });
  $('#bkOut').onclick = exportBackup; $('#bkIn').onclick = () => $('#bkFile').click();
  $('#bkFile').onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ''; };
  $('#stGuide').onclick = () => openGuide(); $('#stAbout').onclick = () => { renderAbout(); show('about'); };
  $('#stReset').onclick = () => confirmBox(T('resetQ1'), T('resetAll'), () => confirmBox(T('resetQ2'), T('resetYes'), () => { LS.keys().forEach(k => LS.del(k)); location.reload(); }));
}
function exportBackup() {
  const data = { app: 'yanivnest', v: APP_VERSION, by: ST.name, date: new Date().toISOString(), settings: ST, stats: STATS, replays: REPLAYS, game: LS.get('game', null) };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }), name = 'yanivnest-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = typeof File !== 'undefined' ? new File([blob], name, { type: 'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'YanivNest', text: T('backupBy', { n: ST.name || '' }) }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(T('exported'));
}
function importBackup(f) {
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { toast(T('badFile')); return; }
    if (!d || d.app !== 'yanivnest') { toast(T('badFile')); return; }
    confirmBox(T('importQ', { n: d.by || '?', d: (d.date || '').slice(0, 10) }), T('importB'), () => {
      LS.set('settings', d.settings || {}); LS.set('stats', d.stats || {}); LS.set('replays', d.replays || []); if (d.game) LS.set('game', d.game); else LS.del('game');
      location.reload();
    });
  };
  r.readAsText(f);
}

/* ---------- stats ---------- */
function renderStats() {
  const box = (mode, title) => {
    const s = STATS[mode] || {}, g = s.games || 0, w = s.wins || 0;
    const cells = mode === 'hot' ? [['games', g], ['rounds', s.rounds || 0]] : [['games', g], ['wins', w], ['winPct', g ? Math.round(100 * w / g) + '%' : '—'], ['calls', s.calls || 0], ['yanivs', s.yanivs || 0], ['caught', s.caught || 0], ['assafs', s.assafs || 0], ['rounds', s.rounds || 0]];
    let extra = '';
    if (mode === 'cpu') extra = '<table class="sc" style="margin-top:10px"><tr><th>' + T('level') + '</th><th>' + T('games') + '</th><th>' + T('wins') + '</th></tr>' + [0, 1, 2, 3].map(l => '<tr><td>' + lvlName(l) + '</td><td>' + (s['g' + l] || 0) + '</td><td>' + (s['w' + l] || 0) + '</td></tr>').join('') + '</table>';
    return '<div class="card"><h3>' + title + '</h3><div class="stat">' + cells.map(c => '<div><b class="ltr">' + c[1] + '</b><span>' + T('s_' + c[0]) + '</span></div>').join('') + '</div>' + extra + '</div>';
  };
  const how = Object.keys(STATS.how || {}).length ? '<div class="card"><h3>' + T('howWon') + '</h3>' + ['how1', 'how2', 'how3', 'how4'].map(k => '<div class="sw"><span>' + T(k) + '</span><b class="ltr">' + (STATS.how[k] || 0) + '</b></div>').join('') + '</div>' : '';
  $('#statBody').innerHTML = box('cpu', '🤖 ' + T('mCpu')) + box('net', '🌐 ' + T('mNet')) + box('hot', '📱 ' + T('mHot')) + how;
}
function renderReplays() {
  const B = $('#repBody');
  if (!REPLAYS.length) { B.innerHTML = '<div class="card"><p>' + T('noReplays') + '</p><button class="btn main" data-home>' + T('playNow') + '</button></div>'; B.querySelector('[data-home]').onclick = () => openSetup('cpu'); return; }
  B.innerHTML = REPLAYS.map((r, i) => '<button class="mode" data-rp="' + i + '"><span class="ic">' + ({ cpu: '🤖', hot: '📱', net: '🌐' }[r.mode] || '🃏') + '</span><span><b>' + esc(r.players.map(p => p.name).join(' · ')) + '</b><span>' + new Date(r.date).toLocaleDateString() + ' · ' + T('winnerIs', { n: esc(r.players[r.winner] ? r.players[r.winner].name : '') }) + ' · ' + T('roundsN', { n: r.log.length }) + '</span></span></button>').join('');
  B.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => openReplay(REPLAYS[+b.dataset.rp]));
}

/* ---------- rules / about / guide ---------- */
function openRules(inGame) {
  $('#rulesBody').innerHTML = T('rulesHTML', { l: ST.rules.limit, a: ST.rules.assaf, m: ST.rules.max });
  if (inGame) { const o = overlay('<div class="rules">' + T('rulesHTML', { l: CUR ? curView().cfg.limit : 7, a: CUR ? curView().cfg.assaf : 30, m: CUR ? curView().cfg.max : 100 }) + '</div><button class="btn wide" data-x>' + T('close') + '</button>'); o.querySelector('[data-x]').onclick = () => closeOv(o); return; }
  show('rules');
}
function renderAbout() {
  $('#aboutBody').innerHTML = '<div class="card" style="text-align:center"><img src="icon-192.png" alt="" width="84" height="84" style="border-radius:20px"><h2 style="margin-top:8px">YanivNest · יניב</h2><p class="muted ltr">v' + APP_VERSION + '</p></div>'
    + '<div class="card"><div class="sw"><span>' + T('a_ver') + '</span><b class="ltr">' + APP_VERSION + '</b></div><div class="sw"><span>' + T('a_dev') + '</span><b>Barak Aflalo</b></div><div class="sw"><span>' + T('a_plat') + '</span><b class="ltr">PWA · HTML5</b></div><div class="sw"><span>' + T('a_store') + '</span><b>' + T('a_local') + '</b></div><div class="sw"><span>' + T('a_lic') + '</span><b class="ltr">© AppNest 2026</b></div></div>'
    + '<div class="card seats"><a class="btn" href="https://appnest-store.pages.dev" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">🏪 ' + T('a_storeLink') + '</a><button class="btn" id="aShare">📤 ' + T('a_share') + '</button><a class="btn" href="mailto:appnest55@gmail.com?subject=YanivNest" style="text-align:center;text-decoration:none">✉️ ' + T('a_feedback') + '</a><button class="btn" id="aGuide">🧭 ' + T('guide') + '</button><a class="btn" href="privacy_policy.html" target="_blank" style="text-align:center;text-decoration:none">🔒 ' + T('a_privacy') + '</a></div>'
    + '<div class="card"><p class="muted" style="font-size:14px;margin:0">' + T('a_disc') + '</p></div>';
  $('#aShare').onclick = () => { const d = { title: 'YanivNest', text: T('shareTxt', { n: ST.name || '' }), url: location.origin + location.pathname }; if (navigator.share) navigator.share(d).catch(() => {}); else (navigator.clipboard ? navigator.clipboard.writeText(d.url) : Promise.reject()).then(() => toast(T('copied'))).catch(() => toast(d.url)); };
  $('#aGuide').onclick = () => openGuide();
}
function openGuide() {
  const steps = ['g1', 'g2', 'g3', 'g4', 'g5'], icons = ['🃏', '👆', '♻️', '📣', '🎙'];
  let i = 0;
  const o = overlay('<div class="guide" id="gBox"></div>');
  const draw = () => {
    o.querySelector('#gBox').innerHTML = '<div style="font-size:52px;text-align:center">' + icons[i] + '</div><h2 style="text-align:center">' + T(steps[i] + 't') + '</h2><p style="font-size:16px">' + T(steps[i] + 'd', { l: ST.rules.limit }) + '</p>'
      + '<div class="dots">' + steps.map((s, k) => '<i' + (k === i ? ' class="on"' : '') + '></i>').join('') + '</div>'
      + '<div class="row"><button class="btn" data-g="skip">' + T('skip') + '</button><button class="btn main" data-g="next">' + (i < steps.length - 1 ? T('next') : T('letsPlay')) + '</button></div>';
  };
  o.onclick = e => { const b = e.target.closest('[data-g]'); if (!b) return; if (b.dataset.g === 'next' && i < steps.length - 1) { i++; draw(); } else { ST.guided = true; saveST(); closeOv(o); } };
  draw();
}

/* =====================================================================
   YanivNest — init (embedded LAST: everything above must already exist)
   ===================================================================== */
(function init() {
  applyLook(); applyLang(); renderHome();
  $('#mCpu').onclick = () => openSetup('cpu');
  $('#mHot').onclick = () => openSetup('hot');
  $('#mNet').onclick = () => { show('online'); renderNet(); };
  $('#tRules').onclick = () => openRules(false);
  $('#tStats').onclick = () => { renderStats(); show('stats'); };
  $('#tReplays').onclick = () => { renderReplays(); show('replays'); };
  $('#tSettings').onclick = () => { renderSettings(); show('settings'); };
  $('#qAbout').onclick = () => { renderAbout(); show('about'); };
  $('#qTheme').onclick = () => { ST.theme = THEMES[(THEMES.indexOf(ST.theme) + 1) % THEMES.length]; saveST(); applyLook(); toast(T('theme') + ': ' + T('th_' + ST.theme), 1200); };
  $('#qMode').onclick = () => { ST.mode = ST.mode === 'day' ? 'night' : 'day'; saveST(); applyLook(); };
  document.addEventListener('click', e => { if (e.target.closest('[data-home]')) { show('home'); renderHome(); } });
  $('#netBack').onclick = () => { show('home'); renderHome(); };
  bindGame(); bindVoice();
  // browsers block sound until the first tap
  addEventListener('pointerdown', () => { try { if (AC && AC.state === 'suspended') AC.resume(); } catch (e) {} }, { passive: true });
  // invite link: ?join=CODE
  const q = new URLSearchParams(location.search);
  if (q.get('join')) { if (NET && NET.role === 'guest' && NET.sess && NET.sess.code === q.get('join').toUpperCase()) netResume(); else { NET = null; LS.del('net'); show('online'); renderNet(); } }
  else if (!ST.guided) openGuide();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !q.get('nosw')) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.__yaniv = { YE, YAI, get CUR() { return CUR; }, get NET() { return NET; }, get LINK() { return LINK; } };   // for automated tests
})();


</script>
